# Simulator setting
frame_skip: 4

# Reward parameters
forward_reward_weight: 1.0
ctrl_cost_weight: 0.001
healthy_reward: 1.0

# General parameters
terminate_when_unhealthy: true
healthy_state_range:
- -100.0
- 100.0
healthy_z_range:
- 0.7
- 10000.0
healthy_angle_range:
- -0.2
- 0.2
reset_noise_scale: 0.005
exclude_current_positions_from_observation: true