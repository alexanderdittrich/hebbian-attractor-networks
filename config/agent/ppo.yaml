# Training settings
num_timesteps: 100000000
num_envs: 8192
num_eval_envs: 128
episode_length: 1000
num_evals: 30
num_minibatches: 32
num_updates_per_batch: 4
num_resets_per_eval: 1
unroll_length: 20
batch_size: 256
seed: 1

# Algortihm settings
reward_scaling: 1.0
normalize_observations: true
action_repeat: 1
discounting: 0.97
learning_rate: 3e-4
entropy_cost: 0.01
max_grad_norm: 1.0
clipping_epsilon: 0.2
network_factory:
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes: [512, 256, 128]
  policy_obs_key: state
  value_obs_key: state